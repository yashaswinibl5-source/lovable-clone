spring.application.name=lovable_clone
gemini.api.key=
gemini.model=gemini-1.5-flashlash

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/lovable_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=
jwt.expiration-ms=86400000

# Stripe Configuration (Test Mode)
stripe.api.key=
stripe.pro-monthly-price-in-cents=2000
stripe.success-url=http://localhost:8080/api/v1/payments/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:8080/api/v1/payments/cancel

# Stripe Webhook Secret (Used to cryptographically verify events come from Stripe)
stripe.webhook.secret=
